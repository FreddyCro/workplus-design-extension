<!doctype html>
<!-- 本機預覽頁，由 dev/server.mjs 伺服。流程照 src/content.js 的 mount()，只把 chrome.* 換成 shim。 -->
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WorkPlus Skin · dev</title>
    <!--WP_CSS-->
    <style>html, body { margin: 0; }</style>
  </head>
  <body>
    <script type="module">
      const TAG = '[wp-skin dev]';

      // chrome.storage.local → localStorage（每個 key 一筆，前綴避免和其他東西撞名）
      const PREFIX = 'wp-skin-dev:';
      const read = (k) => {
        const v = localStorage.getItem(PREFIX + k);
        if (v === null) return undefined;
        try { return JSON.parse(v); } catch { return undefined; }
      };
      const storageLocal = {
        async get(keys) {
          if (keys == null) {
            const out = {};
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k.startsWith(PREFIX)) out[k.slice(PREFIX.length)] = read(k.slice(PREFIX.length));
            }
            return out;
          }
          const defaults = typeof keys === 'string' ? { [keys]: undefined } : Array.isArray(keys) ? Object.fromEntries(keys.map((k) => [k, undefined])) : keys;
          const out = {};
          for (const [k, d] of Object.entries(defaults)) {
            const v = read(k);
            if (v !== undefined) out[k] = v;
            else if (d !== undefined) out[k] = d;
          }
          return out;
        },
        async set(obj) {
          for (const [k, v] of Object.entries(obj)) localStorage.setItem(PREFIX + k, JSON.stringify(v));
        },
        async remove(keys) {
          for (const k of [].concat(keys)) localStorage.removeItem(PREFIX + k);
        },
        async clear() {
          for (const k of Object.keys(localStorage)) if (k.startsWith(PREFIX)) localStorage.removeItem(k);
        },
      };
      globalThis.chrome = {
        ...(globalThis.chrome ?? {}),
        storage: { local: storageLocal },
        runtime: { ...(globalThis.chrome?.runtime ?? {}), getURL: (p) => new URL(`/${p}`, location.origin).href },
      };

      // 跟 content.js 的 mount() 一樣；shadow root 用 open，DevTools 可以直接改樣式
      const host = document.createElement('div');
      host.id = 'wp-skin-root';
      document.body.appendChild(host);
      const root = host.attachShadow({ mode: 'open' });
      import(chrome.runtime.getURL('src/app/main.js'))
        .then(({ start }) => start(root))
        .catch((err) => {
          console.error(TAG, err);
          const msg = document.createElement('div');
          msg.style.cssText = 'font: 14px system-ui; padding: 16px; color: #cf222e;';
          msg.textContent = `載入失敗：${err.message}`;
          root.replaceChildren(msg);
        });

      // 改 src/ 或 fixture 會自動重新整理；偏好（版面、收合狀態）存在 localStorage，不會掉
      new EventSource('/__reload').onmessage = () => location.reload();
    </script>
  </body>
</html>
